name: Release & Publish to PyPI

on:
  push:
    tags:
      - 'v*'

jobs:
  release-and-publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write      # Required for PyPI trusted publishing
      contents: write      # Required for creating GitHub releases
      
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    
    # Extract version from tag (e.g., v0.7.0 -> 0.7.0)
    - name: Extract version
      id: version
      run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
    
    # Extract changelog section for this version
    - name: Extract changelog
      id: changelog
      run: |
        python scripts/extract_changelog.py ${{ steps.version.outputs.VERSION }} > release_notes.md
        echo "Changelog extracted for v${{ steps.version.outputs.VERSION }}"
    
    # Create GitHub Release with changelog
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        body_path: release_notes.md
        draft: false
        prerelease: false
    
    # Build package for PyPI
    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build coverage
        
    - name: Build package
      run: python -m build
      
    # Publish to PyPI using trusted publishing
    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
